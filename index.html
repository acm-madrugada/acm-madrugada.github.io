<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACM S. Amaro Madrugada</title>
<meta name="description" content="Placar, classificação e BAM BAM BAM do dia da pelada da ACM S. Amaro Madrugada.">
<meta name="theme-color" content="#0B2547">

<!-- Prévia no WhatsApp: se o seu endereço não for acm-madrugada.github.io, troque nas duas linhas abaixo -->
<meta property="og:url" content="https://acm-madrugada.github.io/">
<meta property="og:image" content="https://acm-madrugada.github.io/og.png">
<meta property="og:type" content="website">
<meta property="og:title" content="ACM S. Amaro Madrugada">
<meta property="og:description" content="Placar, classificação e BAM BAM BAM do dia.">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<!-- Ícone na tela do celular -->
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ACM Madrugada">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  html,body{margin:0;height:100%;background:#0B2547;overflow:hidden}
  body{padding-top:env(safe-area-inset-top,0px);box-sizing:border-box}
  iframe{display:block;width:100%;height:100%;border:0;background:#EDF1F7}
  .carregando{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font:600 16px/1.4 system-ui,sans-serif;text-align:center;pointer-events:none;transition:opacity .3s}
  .carregando img{width:84px;height:84px;border-radius:18px;display:block;margin:0 auto 14px}
  .carregando a{color:#fff;pointer-events:auto}
</style>
</head>
<body>
<div class="carregando" id="carregando">
  <div><img src="apple-touch-icon.png" alt="">Carregando a resenha…<br><small id="ajuda" style="opacity:0;transition:opacity .3s">Demorando? <a id="direto" href="#" target="_top">Abrir direto</a></small></div>
</div>
<script>
  /* COLE AQUI o link do seu Apps Script (o que termina em /exec) */
  const LINK_DO_APP = 'COLE_AQUI_O_LINK_EXEC';

  const f = document.createElement('iframe');
  f.src = LINK_DO_APP;
  f.title = 'ACM S. Amaro Madrugada';
  f.allow = 'clipboard-write';
  f.onload = () => { const c = document.getElementById('carregando'); c.style.opacity = 0; setTimeout(() => c.remove(), 400); };
  document.body.appendChild(f);
  document.getElementById('direto').href = LINK_DO_APP;
  setTimeout(() => { const a = document.getElementById('ajuda'); if (a) a.style.opacity = 1; }, 6000);
</script>
</body>
</html>
